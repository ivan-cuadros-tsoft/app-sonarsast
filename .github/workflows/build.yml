name: Build

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: SonarCloud
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  

      # 🔍 Scan correcto para SonarCloud
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      # 🐍 Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      # 📄 Reporte SAST
      - name: Generate SAST Report
        run: python scripts/generar_reporte_sast.py
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_URL: https://sonarcloud.io
          PROJECT_KEY: "ivan-cuadros-tsoft_app-sonarsast"  # 👈 CAMBIA ESTO

      # Artefacto
      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: reporte-sast
          path: reporte_sast.md

      # 📄 Reporte SAST HTML
      - name: Generate HTML SAST Report
        run: python scripts/generar_reporte_sast_html.py
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_URL: https://sonarcloud.io
          PROJECT_KEY: "ivan-cuadros-tsoft_app-sonarsast"

      - name: Upload HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: reporte_sast_html
          path: reporte_sast_html.html