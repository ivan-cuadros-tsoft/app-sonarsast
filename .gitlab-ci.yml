stages:
  - install
  - test
  - sonar

variables:
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"

cache:
  paths:
    - node_modules/
    - .sonar/cache

install_dependencies:
  stage: install
  image: node:20
  script:
    - npm install
  artifacts:
    paths:
      - node_modules/

unit_tests:
  stage: test
  image: node:20
  script:
    - npm run test -- --watch=false --browsers=ChromeHeadless

sonar_scan:
  stage: sonar
  image: sonarsource/sonar-scanner-cli:latest
  script:
    - sonar-scanner
      -Dsonar.projectKey=SonarSASTNodeAngular
      -Dsonar.sources=.
      -Dsonar.host.url=http://192.168.1.50:9000
      -Dsonar.token=$SONAR_TOKEN
  only:
    - main
    - develop
    
