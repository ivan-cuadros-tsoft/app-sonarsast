sonar_scan:
  stage: sonar
  image: sonarsource/sonar-scanner-cli:latest
  script:
    - sonar-scanner
      -Dsonar.projectKey=SonarSASTNodeAngular
      -Dsonar.sources=.
      -Dsonar.host.url=http://192.168.204.40:9000
      -Dsonar.login=$SONAR_TOKEN
  only:
    - main
    - develop

