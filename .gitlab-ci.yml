stages:
  - install
  - sonar

variables:
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"

cache:
  paths:
    - node_modules/
    - .sonar/cache

install_dependencies:
  stage: install
  image: node:20
  tags:                             # <- y aquí
    - local-sast
  script:
    - npm install
  artifacts:
    paths:
      - node_modules/

sonar_scan:
  stage: sonar
  image: sonarsource/sonar-scanner-cli:latest
  tags:                             # <- y aquí
    - local-sast
  script:
    - sonar-scanner
      -Dsonar.projectKey=SonarSASTNodeAngular
      -Dsonar.sources=.
      -Dsonar.host.url=http://192.168.204.29:9000
      -Dsonar.login=$SONAR_TOKEN
  only:
    - main
    - develop
